<!DOCTYPE html>
<html>

<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(0, 200, 150, 0.08), transparent 34%),
        #0f0f0f;
      color: white;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 22px;
    }

    .login-shell {
      max-width: 360px;
      width: 100%;
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    .logo {
      align-items: center;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      color: #00c896;
      display: inline-flex;
      font-size: 18px;
      font-weight: 700;
      height: 46px;
      justify-content: center;
      margin-bottom: 12px;
      width: 46px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin: 0;
    }

    .login-card {
      background: rgba(31, 31, 31, 0.94);
      border: 1px solid #333;
      border-radius: 14px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.38);
      padding: 18px;
    }

    .field {
      margin-bottom: 12px;
      text-align: left;
    }

    label {
      color: #cfcfcf;
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      background: #141414;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
      padding: 12px 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      width: 100%;
    }

    input::placeholder {
      color: #6f6f6f;
    }

    input:focus {
      background: #171717;
      border-color: rgba(0, 200, 150, 0.65);
      box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.12);
    }

    .error {
      color: #ff8b8b;
      font-size: 13px;
      min-height: 18px;
      margin: 2px 0 12px;
      text-align: left;
    }

    button {
      background: #00c896;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #07110e;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 100%;
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="brand">
      <div class="logo">N</div>
      <h1>Profile Login</h1>
      <p class="subtitle">Access your profile</p>
    </section>

    <section class="login-card">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" placeholder="Enter username" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" placeholder="Enter password" type="password" autocomplete="current-password">
      </div>

      <div id="error" class="error"></div>

      <button type="button" onclick="login()">Login</button>
    </section>
  </main>

  <script>
    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('error');

      error.innerText = "";

      if (!username || !password) {
        error.innerText = "Enter your username and password.";
        return;
      }

      // save login locally
      localStorage.setItem('username', username);
      localStorage.setItem('password', password);

      if (username === "66546788" && password === "123") {
        window.location.href = "/admin.html";
        return;
      }

      // redirect to profile
      window.location.href = `/${username}`;
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        login();
      }
    });
  </script>
</body>

</html>
