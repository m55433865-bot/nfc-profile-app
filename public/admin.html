<!DOCTYPE html>
<html>

<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/nfc/favicon.ico" sizes="any">
  <link rel="icon" href="/nfc/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/nfc/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/nfc/apple-touch-icon.png">
  <link rel="manifest" href="/nfc/site.webmanifest">
  <meta name="theme-color" content="#00c896">
  <link rel="stylesheet" href="/nfc/style.css">
</head>

<body>
  <div class="container">
    <div id="card">
      <div class="admin-header">
        <h1 class="admin-title">Admin Panel</h1>
        <div class="admin-actions">
          <button type="button" class="ui-btn secondary" onclick="openLogoutConfirm()">Logout</button>
          <button type="button" class="ui-btn primary" onclick="openAddUserModal()">+ Add User</button>
        </div>
      </div>

      <div id="adminMessage" class="admin-message"></div>
      <input id="adminSearchInput" class="theme-input admin-search" placeholder="Search users by email, username, or phone">
      <div id="usersList" class="admin-list"></div>
    </div>
  </div>

  <div id="userMenu" class="floating-menu">
    <button type="button" onclick="openPasswordModal()">Change Password</button>
    <button type="button" class="danger" onclick="deleteSelectedUser()">Delete User</button>
  </div>

  <div id="logoutConfirmModal" class="smart-modal" onclick="closeLogoutConfirm()">
    <div class="modal-card confirm-card" onclick="event.stopPropagation()">
      <div class="modal-title">Are you sure you want to logout?</div>
      <div class="form-actions">
        <button type="button" class="ui-btn secondary" onclick="closeLogoutConfirm()">No</button>
        <button type="button" class="ui-btn primary" onclick="logoutAdmin()">Yes</button>
      </div>
    </div>
  </div>

  <div id="adminModal" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  ">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title">Add user</div>

      <div class="link-edit-fields">
        <input id="emailInput" class="theme-input" placeholder="User email">
        <input id="passwordInput" class="theme-input" placeholder="Temporary password" type="password">

        <div class="form-actions">
          <button type="button" class="ui-btn secondary" onclick="closeModal()">Cancel</button>
          <button type="button" class="ui-btn primary" onclick="submitModal()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_USERNAME = "66546788";
    const ADMIN_EMAIL = "66546788@yourteck.com";
    const ADMIN_PASSWORD = "yourteck@66546788";
    const BASE_PATH = "/nfc";
    const appPath = (path = "") => `${BASE_PATH}${path.startsWith("/") ? path : `/${path}`}`;
    const apiPath = (path = "") => `${BASE_PATH}/api${path.startsWith("/") ? path : `/${path}`}`;

    const storedEmail = localStorage.getItem("email");
    const storedPassword = localStorage.getItem("password");
    const isAdmin = storedEmail === ADMIN_EMAIL && storedPassword === ADMIN_PASSWORD;

    const usersList = document.getElementById("usersList");
    const userMenu = document.getElementById("userMenu");
    const adminMessage = document.getElementById("adminMessage");
    const adminModal = document.getElementById("adminModal");
    const modalTitle = document.getElementById("modalTitle");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const adminSearchInput = document.getElementById("adminSearchInput");

    let selectedUsername = null;
    let modalMode = "add";
    let allUsers = [];
    let expandedUsername = null;

    function adminHeaders() {
      return {
        "Content-Type": "application/json",
        "x-admin-username": ADMIN_USERNAME,
        "x-admin-password": ADMIN_PASSWORD
      };
    }

    function showMessage(message) {
      adminMessage.innerText = message || "";
    }

    function loadUsers() {
      fetch(apiPath("/admin/users"), {
        headers: adminHeaders()
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          allUsers = data.users || [];
          renderUsers(allUsers);
        });
    }

    function legacyRenderUsers(users) {
      usersList.innerHTML = "";

      users.forEach(user => {
        const row = document.createElement("div");
        row.className = "link";

        const name = document.createElement("div");
        name.innerHTML = `
          <span class="admin-row-name">${user.username}</span>
          ${user.isAdmin ? `<span class="admin-row-meta">admin</span>` : ""}
        `;

        row.appendChild(name);

        if (!user.isAdmin) {
          const menuBtn = document.createElement("span");
          menuBtn.className = "menu-btn edit-icon edit-menu-btn";
          menuBtn.innerText = "⋮";
          menuBtn.onclick = (event) => {
            event.stopPropagation();
            showUserMenu(user.username, event);
          };

          row.appendChild(menuBtn);
        }

        usersList.appendChild(row);
      });
    }

    function renderUsers(users) {
      usersList.innerHTML = "";
      const query = adminSearchInput.value.trim().toLowerCase();
      const filteredUsers = query
        ? users.filter(user => {
          const phone = getUserPhone(user).toLowerCase();
          return [
            user.email,
            user.username,
            user.displayName,
            phone
          ].some(value => String(value || "").toLowerCase().includes(query));
        })
        : users;

      if (!filteredUsers.length) {
        usersList.innerHTML = `<div class="admin-empty">No users found.</div>`;
        return;
      }

      filteredUsers.forEach(user => {
        const item = document.createElement("div");
        item.className = `admin-user-card ${expandedUsername === user.username ? "expanded" : ""}`;

        const row = document.createElement("div");
        row.role = "button";
        row.tabIndex = 0;
        row.className = "admin-user-row";
        row.onclick = () => toggleUserDetails(user.username);
        row.onkeydown = (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleUserDetails(user.username);
          }
        };

        const name = document.createElement("div");
        name.className = "admin-user-summary";
        name.innerHTML = `
          <span class="admin-row-name">${escapeHtml(user.displayName || user.username)}</span>
          <span class="admin-row-subtitle">${escapeHtml(user.email || user.username)}</span>
          ${user.isAdmin ? `<span class="admin-row-meta">admin</span>` : ""}
        `;

        row.appendChild(name);

        const actions = document.createElement("span");
        actions.className = "admin-row-actions";
        const chevron = document.createElement("span");
        chevron.className = "admin-chevron";
        chevron.innerHTML = "⌄";
        actions.appendChild(chevron);

        if (!user.isAdmin) {
          const menuBtn = document.createElement("button");
          menuBtn.type = "button";
          menuBtn.className = "menu-btn edit-icon edit-menu-btn";
          menuBtn.innerText = "⋮";
          menuBtn.onclick = (event) => {
            event.stopPropagation();
            showUserMenu(user.username, event);
          };

          actions.appendChild(menuBtn);
        }

        row.appendChild(actions);

        const details = document.createElement("div");
        details.className = "admin-user-details";
        details.innerHTML = renderUserDetails(user);

        item.appendChild(row);
        item.appendChild(details);
        usersList.appendChild(item);
      });
    }

    function toggleUserDetails(username) {
      closeUserMenu();
      expandedUsername = expandedUsername === username ? null : username;
      renderUsers(allUsers);
    }

    function renderUserDetails(user) {
      const email = user.email || "Not added";
      const phone = getUserPhone(user) || "Not added";
      const profilePath = appPath(`/profile/${encodeURIComponent(user.username)}`);
      const profileUrl = `${window.location.origin}${profilePath}`;

      return `
        <div class="admin-detail-grid">
          <div class="admin-detail-item">
            <span>Email</span>
            <strong>${escapeHtml(email)}</strong>
          </div>
          <div class="admin-detail-item">
            <span>Profile slug</span>
            <strong>${escapeHtml(user.username)}</strong>
          </div>
          <div class="admin-detail-item">
            <span>Phone</span>
            <strong>${escapeHtml(phone)}</strong>
          </div>
          <div class="admin-detail-item">
            <span>Public profile</span>
            <a href="${profilePath}" target="_blank" rel="noopener">View Profile</a>
          </div>
        </div>
        <div class="admin-profile-url">${escapeHtml(profileUrl)}</div>
      `;
    }

    function getUserPhone(user) {
      const links = Array.isArray(user.links) ? user.links : [];
      const phoneLink = links.find(link => isLinkType(link, "phone")) || links.find(link => isLinkType(link, "whatsapp"));
      if (!phoneLink) return "";

      const source = phoneLink.value || phoneLink.finalUrl || phoneLink.url || "";
      const decoded = safeDecode(source).trim();
      const digits = decoded.replace(/\D/g, "");
      if (!digits) return "";

      return `+${digits}`;
    }

    function isLinkType(link, type) {
      const rawType = String(link?.type || "").toLowerCase();
      const rawName = String(link?.name || link?.label || "").toLowerCase();
      const rawUrl = String(link?.finalUrl || link?.url || link?.value || "").toLowerCase();
      if (type === "phone") return rawType === "phone" || rawUrl.startsWith("tel:");
      if (type === "whatsapp") return rawType === "whatsapp" || rawUrl.includes("wa.me") || rawUrl.includes("whatsapp.com");
      return rawType === type || rawName.includes(type);
    }

    function safeDecode(value) {
      try {
        return decodeURIComponent(String(value || ""));
      } catch (error) {
        return String(value || "");
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showUserMenu(username, event) {
      event.preventDefault();
      event.stopPropagation();
      selectedUsername = username;
      userMenu.style.display = "flex";
      positionFloatingMenu(userMenu, event.clientX, event.clientY);
    }

    function closeUserMenu() {
      userMenu.style.display = "none";
    }

    function positionFloatingMenu(menu, x, y) {
      const margin = 12;
      menu.style.visibility = "hidden";
      menu.style.left = "0px";
      menu.style.top = "0px";

      requestAnimationFrame(() => {
        const rect = menu.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width - margin;
        const maxTop = window.innerHeight - rect.height - margin;
        const left = Math.max(margin, Math.min(x, maxLeft));
        const top = Math.max(margin, Math.min(y, maxTop));

        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
        menu.style.visibility = "visible";
      });
    }

    function openAddUserModal() {
      modalMode = "add";
      selectedUsername = null;
      showMessage("");
      modalTitle.innerText = "Add user";
      emailInput.style.display = "block";
      emailInput.value = "";
      passwordInput.value = "";
      adminModal.style.display = "flex";
      closeUserMenu();
    }

    function openPasswordModal() {
      if (!selectedUsername || selectedUsername === ADMIN_USERNAME) return;

      modalMode = "password";
      modalTitle.innerText = `Change password`;
      emailInput.style.display = "none";
      emailInput.value = "";
      passwordInput.value = "";
      adminModal.style.display = "flex";
      closeUserMenu();
    }

    function closeModal() {
      adminModal.style.display = "none";
      emailInput.style.display = "block";
      emailInput.value = "";
      passwordInput.value = "";
    }

    function submitModal() {
      if (modalMode === "add") {
        addUser();
        return;
      }

      updatePassword();
    }

    function addUser() {
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();

      if (!email) {
        showMessage("User email is required");
        return;
      }

      if (!password) {
        showMessage("Temporary password is required");
        return;
      }

      // Basic email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage("Please enter a valid email address");
        return;
      }

      fetch(apiPath("/admin/users"), {
        method: "POST",
        headers: adminHeaders(),
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          closeModal();
          showMessage("User added");
          loadUsers();
        });
    }

    function updatePassword() {
      const password = passwordInput.value.trim();
      if (!selectedUsername || !password) return;

      fetch(apiPath(`/admin/users/${selectedUsername}/password`), {
        method: "POST",
        headers: adminHeaders(),
        body: JSON.stringify({ password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          closeModal();
          showMessage("Password updated");
          loadUsers();
        });
    }

    function deleteSelectedUser() {
      if (!selectedUsername || selectedUsername === ADMIN_USERNAME) return;

      fetch(apiPath(`/admin/users/${selectedUsername}`), {
        method: "DELETE",
        headers: adminHeaders()
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          showMessage("User deleted");
          closeUserMenu();
          loadUsers();
        });
    }

    function openLogoutConfirm() {
      closeUserMenu();
      document.getElementById("logoutConfirmModal").style.display = "flex";
    }

    function closeLogoutConfirm() {
      document.getElementById("logoutConfirmModal").style.display = "none";
    }

    function logoutAdmin() {
      localStorage.removeItem("email");
      localStorage.removeItem("password");
      window.location.href = appPath("/login");
    }

    adminSearchInput.addEventListener("input", () => renderUsers(allUsers));
    document.addEventListener("click", closeUserMenu);

    if (!isAdmin) {
      localStorage.removeItem("email");
      localStorage.removeItem("password");
      window.location.href = appPath("/login");
    } else {
      loadUsers();
    }
  </script>
</body>

</html>
