<!DOCTYPE html>
<html>

<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/nfc/favicon.ico" sizes="any">
  <link rel="icon" href="/nfc/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/nfc/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/nfc/apple-touch-icon.png">
  <link rel="manifest" href="/nfc/site.webmanifest">
  <meta name="theme-color" content="#070807">
  <link rel="stylesheet" href="/nfc/style.css?v=admin-tabs-1">
</head>

<body>
  <div class="container">
    <div id="card">
      <div class="admin-header">
        <h1 class="admin-title">Admin Panel</h1>
        <div class="admin-actions">
          <button type="button" class="ui-btn secondary" onclick="openLogoutConfirm()">Logout</button>
          <button type="button" class="ui-btn primary" onclick="openAddUserModal()">+ Add User</button>
        </div>
      </div>

      <div id="adminMessage" class="admin-message"></div>
      <div class="admin-tabs" role="tablist" aria-label="Admin sections">
        <button id="adminUsersTab" class="admin-tab active" type="button" onclick="switchAdminTab('users')">Users</button>
        <button id="adminOrdersTab" class="admin-tab" type="button" onclick="switchAdminTab('orders')">Orders</button>
      </div>
      <input id="adminSearchInput" class="theme-input admin-search" placeholder="Search users by email, username, or phone">
      <div id="usersList" class="admin-list"></div>
      <div id="ordersList" class="admin-list" style="display:none;"></div>
    </div>
  </div>

  <div id="userMenu" class="floating-menu">
    <button type="button" onclick="openPasswordModal()">Change Password</button>
    <button type="button" class="danger" onclick="deleteSelectedUser()">Delete User</button>
  </div>

  <div id="logoutConfirmModal" class="smart-modal" onclick="closeLogoutConfirm()">
    <div class="modal-card confirm-card" onclick="event.stopPropagation()">
      <div class="modal-title">Are you sure you want to logout?</div>
      <div class="form-actions">
        <button type="button" class="ui-btn secondary" onclick="closeLogoutConfirm()">No</button>
        <button type="button" class="ui-btn primary" onclick="logoutAdmin()">Yes</button>
      </div>
    </div>
  </div>

  <div id="resetUserConfirmModal" class="smart-modal" onclick="closeResetUserConfirm()">
    <div class="modal-card confirm-card" onclick="event.stopPropagation()">
      <div class="modal-title">Reset user profile?</div>
      <div id="resetUserCopy" class="smart-add-subtitle">
        This clears the user's profile details and sends them through onboarding again.
      </div>
      <div id="resetUserError" class="modal-error"></div>
      <div class="form-actions">
        <button type="button" class="ui-btn secondary" onclick="closeResetUserConfirm()">Cancel</button>
        <button id="confirmResetUserBtn" type="button" class="ui-btn danger" onclick="confirmResetUser()">Reset profile</button>
      </div>
    </div>
  </div>

  <div id="adminModal" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  ">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title">Add user</div>

      <div class="link-edit-fields">
        <input id="emailInput" class="theme-input" placeholder="User email">
        <input id="passwordInput" class="theme-input" placeholder="Temporary password" type="password">

        <div class="form-actions">
          <button type="button" class="ui-btn secondary" onclick="closeModal()">Cancel</button>
          <button type="button" class="ui-btn primary" onclick="submitModal()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_USERNAME = "66546788";
    const ADMIN_EMAIL = "66546788@yourteck.com";
    const ADMIN_PASSWORD = "yourteck@66546788";
    const BASE_PATH = "/nfc";
    const appPath = (path = "") => `${BASE_PATH}${path.startsWith("/") ? path : `/${path}`}`;
    const apiPath = (path = "") => `${BASE_PATH}/api${path.startsWith("/") ? path : `/${path}`}`;

    const storedEmail = localStorage.getItem("email");
    const storedPassword = localStorage.getItem("password");
    const isAdmin = storedEmail === ADMIN_EMAIL && storedPassword === ADMIN_PASSWORD;

    const usersList = document.getElementById("usersList");
    const ordersList = document.getElementById("ordersList");
    const userMenu = document.getElementById("userMenu");
    const adminMessage = document.getElementById("adminMessage");
    const adminModal = document.getElementById("adminModal");
    const modalTitle = document.getElementById("modalTitle");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const adminSearchInput = document.getElementById("adminSearchInput");

    let selectedUsername = null;
    let resetUsername = null;
    let modalMode = "add";
    let allUsers = [];
    let allOrders = [];
    let expandedUsername = null;
    let expandedOrderId = null;
    let activeAdminTab = "users";

    function adminHeaders() {
      return {
        "Content-Type": "application/json",
        "x-admin-username": ADMIN_USERNAME,
        "x-admin-password": ADMIN_PASSWORD
      };
    }

    function showMessage(message) {
      adminMessage.innerText = message || "";
    }

    function switchAdminTab(tab) {
      activeAdminTab = tab === "orders" ? "orders" : "users";
      document.getElementById("adminUsersTab").classList.toggle("active", activeAdminTab === "users");
      document.getElementById("adminOrdersTab").classList.toggle("active", activeAdminTab === "orders");
      usersList.style.display = activeAdminTab === "users" ? "flex" : "none";
      ordersList.style.display = activeAdminTab === "orders" ? "flex" : "none";
      adminSearchInput.style.display = activeAdminTab === "users" ? "block" : "none";
      closeUserMenu();

      if (activeAdminTab === "orders") {
        loadOrders();
      } else {
        renderUsers(allUsers);
      }
    }

    function loadUsers() {
      fetch(apiPath("/admin/users"), {
        headers: adminHeaders()
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          allUsers = data.users || [];
          renderUsers(allUsers);
        });
    }

    function loadOrders() {
      fetch(apiPath("/admin/orders"), {
        headers: adminHeaders()
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          allOrders = data.orders || [];
          renderOrders(allOrders);
        })
        .catch(() => showMessage("Orders could not be loaded."));
    }

    function renderUsers(users) {
      usersList.innerHTML = "";
      const query = adminSearchInput.value.trim().toLowerCase();
      const filteredUsers = query
        ? users.filter(user => {
          const phone = getUserPhone(user).toLowerCase();
          return [
            user.email,
            user.username,
            user.displayName,
            phone
          ].some(value => String(value || "").toLowerCase().includes(query));
        })
        : users;

      if (!filteredUsers.length) {
        usersList.innerHTML = `<div class="admin-empty">No users found.</div>`;
        return;
      }

      filteredUsers.forEach(user => {
        const item = document.createElement("div");
        item.className = `admin-user-card ${expandedUsername === user.username ? "expanded" : ""}`;

        const row = document.createElement("div");
        row.role = "button";
        row.tabIndex = 0;
        row.className = "admin-user-row";
        row.onclick = () => toggleUserDetails(user.username);
        row.onkeydown = (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleUserDetails(user.username);
          }
        };

        row.innerHTML = `<span class="admin-row-email">${escapeHtml(user.email || user.username)}</span>`;

        const details = document.createElement("div");
        details.className = "admin-user-details";
        details.innerHTML = renderUserDetails(user);

        item.appendChild(row);
        item.appendChild(details);
        usersList.appendChild(item);
      });
    }

    function toggleUserDetails(username) {
      closeUserMenu();
      expandedUsername = expandedUsername === username ? null : username;
      renderUsers(allUsers);
    }

    function renderOrders(orders) {
      ordersList.innerHTML = "";

      if (!orders.length) {
        ordersList.innerHTML = `<div class="admin-empty">No orders yet.</div>`;
        return;
      }

      orders.forEach(order => {
        const item = document.createElement("div");
        item.className = `admin-user-card admin-order-card ${expandedOrderId === order.id ? "expanded" : ""}`;

        const row = document.createElement("div");
        row.role = "button";
        row.tabIndex = 0;
        row.className = "admin-user-row admin-order-row";
        row.onclick = () => toggleOrderDetails(order.id);
        row.onkeydown = (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleOrderDetails(order.id);
          }
        };

        row.innerHTML = `
          <span class="admin-user-summary">
            <span class="admin-row-name">${escapeHtml(order.invoiceReference || "No reference")} - ${escapeHtml(order.fullName || "Unnamed order")}</span>
            <span class="admin-row-subtitle">${escapeHtml(order.email || "")} - ${escapeHtml(order.phoneNumber || "")}</span>
          </span>
          <span class="admin-row-actions">
            <select class="admin-order-status" onclick="event.stopPropagation()" onchange="updateOrderStatus('${escapeAttr(order.id)}', this.value)">
              ${renderOrderStatusOptions(order.status)}
            </select>
            <span class="admin-chevron">v</span>
          </span>
        `;

        const details = document.createElement("div");
        details.className = "admin-user-details";
        details.innerHTML = renderOrderDetails(order);

        item.appendChild(row);
        item.appendChild(details);
        ordersList.appendChild(item);
      });
    }

    function toggleOrderDetails(orderId) {
      expandedOrderId = expandedOrderId === orderId ? null : orderId;
      renderOrders(allOrders);
    }

    function renderOrderStatusOptions(currentStatus) {
      const statuses = [
        ["pending", "Pending"],
        ["underprocess", "Underprocess"],
        ["delivered", "Delivered"]
      ];

      return statuses
        .map(([value, label]) => `<option value="${value}" ${currentStatus === value ? "selected" : ""}>${label}</option>`)
        .join("");
    }

    function renderOrderDetails(order) {
      return `
        <div class="admin-detail-grid">
          ${renderOrderDetailItem("Reference", order.invoiceReference || "Not assigned")}
          ${renderOrderDetailItem("Full name", order.fullName)}
          ${renderOrderDetailItem("Phone number", order.phoneNumber)}
          ${renderOrderDetailItem("Email", order.email)}
          ${renderOrderDetailItem("Area", order.deliveryArea || getLegacyAddressPart(order.address, "Area"))}
          ${renderOrderDetailItem("Block", order.block || getLegacyAddressPart(order.address, "Block"))}
          ${renderOrderDetailItem("Street", order.street || getLegacyAddressPart(order.address, "Street"))}
          ${renderOrderDetailItem("Building / house", order.buildingNumber || getLegacyAddressPart(order.address, "Building/house"))}
          ${renderOrderDetailItem("Floor / apartment", order.floorApartment || getLegacyAddressPart(order.address, "Floor/apartment") || "None")}
          ${renderOrderDetailItem("Delivery notes", order.deliveryNotes || "None", true)}
          ${renderOrderDetailItem("Address summary", order.address, true)}
          ${renderOrderDetailItem("Design", order.designPreference)}
          ${renderOrderDetailItem("Card notes", order.notes || "None", true)}
          ${renderOrderDetailItem("Status", formatOrderStatus(order.status))}
          ${renderOrderDetailItem("Placed", formatDate(order.createdAt))}
        </div>
      `;
    }

    function getLegacyAddressPart(address, label) {
      const match = String(address || "").match(new RegExp(`${label}:\\\\s*([^,]+)`, "i"));
      return match ? match[1].trim() : "";
    }

    function renderOrderDetailItem(label, value, allowWrap = false) {
      return `
        <div class="admin-detail-item">
          <span>${escapeHtml(label)}</span>
          <strong class="${allowWrap ? "admin-order-details-text" : ""}">${escapeHtml(value || "")}</strong>
        </div>
      `;
    }

    function formatOrderStatus(status) {
      return {
        pending: "Pending",
        underprocess: "Underprocess",
        delivered: "Delivered"
      }[status] || "Pending";
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function updateOrderStatus(orderId, status) {
      fetch(apiPath(`/admin/orders/${orderId}`), {
        method: "PATCH",
        headers: adminHeaders(),
        body: JSON.stringify({ status })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            renderOrders(allOrders);
            return;
          }

          allOrders = allOrders.map(order => order.id === orderId ? data.order : order);
          showMessage("Order status updated");
          renderOrders(allOrders);
        })
        .catch(() => {
          showMessage("Order status could not be updated.");
          renderOrders(allOrders);
        });
    }

    function renderUserDetails(user) {
      const displayName = user.displayName || user.username || "Not added";
      const phone = getUserPhone(user) || "Not added";

      return `
        <div class="admin-detail-grid">
          <div class="admin-detail-item">
            <span>Displayed name</span>
            <strong>${escapeHtml(displayName)}</strong>
          </div>
          <div class="admin-detail-item">
            <span>Mobile number</span>
            <strong>${escapeHtml(phone)}</strong>
          </div>
        </div>
        ${user.isAdmin ? "" : `
          <div class="admin-detail-actions">
            <button type="button" class="ui-btn danger admin-reset-btn" onclick="openResetUserConfirm('${escapeAttr(user.username)}', event)">Reset profile setup</button>
          </div>
        `}
      `;
    }

    function getUserPhone(user) {
      const links = Array.isArray(user.links) ? user.links : [];
      const phoneLink = links.find(link => isLinkType(link, "phone")) || links.find(link => isLinkType(link, "whatsapp"));
      if (!phoneLink) return "";

      const source = phoneLink.finalUrl || phoneLink.url || phoneLink.value || "";
      const decoded = safeDecode(source).trim();
      const digits = decoded.replace(/\D/g, "");
      if (!digits) return "";

      return `+${digits}`;
    }

    function isLinkType(link, type) {
      const rawType = String(link?.type || "").toLowerCase();
      const rawName = String(link?.name || link?.label || "").toLowerCase();
      const rawUrl = String(link?.finalUrl || link?.url || link?.value || "").toLowerCase();
      if (type === "phone") return rawType === "phone" || rawUrl.startsWith("tel:");
      if (type === "whatsapp") return rawType === "whatsapp" || rawUrl.includes("wa.me") || rawUrl.includes("whatsapp.com");
      return rawType === type || rawName.includes(type);
    }

    function safeDecode(value) {
      try {
        return decodeURIComponent(String(value || ""));
      } catch (error) {
        return String(value || "");
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function showUserMenu(username, event) {
      event.preventDefault();
      event.stopPropagation();
      selectedUsername = username;
      userMenu.style.display = "flex";
      positionFloatingMenu(userMenu, event.clientX, event.clientY);
    }

    function closeUserMenu() {
      userMenu.style.display = "none";
    }

    function positionFloatingMenu(menu, x, y) {
      const margin = 12;
      menu.style.visibility = "hidden";
      menu.style.left = "0px";
      menu.style.top = "0px";

      requestAnimationFrame(() => {
        const rect = menu.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width - margin;
        const maxTop = window.innerHeight - rect.height - margin;
        const left = Math.max(margin, Math.min(x, maxLeft));
        const top = Math.max(margin, Math.min(y, maxTop));

        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
        menu.style.visibility = "visible";
      });
    }

    function openAddUserModal() {
      modalMode = "add";
      selectedUsername = null;
      showMessage("");
      modalTitle.innerText = "Add user";
      emailInput.style.display = "block";
      emailInput.value = "";
      passwordInput.value = "";
      adminModal.style.display = "flex";
      closeUserMenu();
    }

    function openPasswordModal() {
      if (!selectedUsername || selectedUsername === ADMIN_USERNAME) return;

      modalMode = "password";
      modalTitle.innerText = `Change password`;
      emailInput.style.display = "none";
      emailInput.value = "";
      passwordInput.value = "";
      adminModal.style.display = "flex";
      closeUserMenu();
    }

    function closeModal() {
      adminModal.style.display = "none";
      emailInput.style.display = "block";
      emailInput.value = "";
      passwordInput.value = "";
    }

    function submitModal() {
      if (modalMode === "add") {
        addUser();
        return;
      }

      updatePassword();
    }

    function addUser() {
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();

      if (!email) {
        showMessage("User email is required");
        return;
      }

      if (!password) {
        showMessage("Temporary password is required");
        return;
      }

      // Basic email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage("Please enter a valid email address");
        return;
      }

      fetch(apiPath("/admin/users"), {
        method: "POST",
        headers: adminHeaders(),
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          closeModal();
          showMessage("User added");
          loadUsers();
        });
    }

    function updatePassword() {
      const password = passwordInput.value.trim();
      if (!selectedUsername || !password) return;

      fetch(apiPath(`/admin/users/${selectedUsername}/password`), {
        method: "POST",
        headers: adminHeaders(),
        body: JSON.stringify({ password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          closeModal();
          showMessage("Password updated");
          loadUsers();
        });
    }

    function deleteSelectedUser() {
      if (!selectedUsername || selectedUsername === ADMIN_USERNAME) return;

      fetch(apiPath(`/admin/users/${selectedUsername}`), {
        method: "DELETE",
        headers: adminHeaders()
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            showMessage(data.error);
            return;
          }

          showMessage("User deleted");
          closeUserMenu();
          loadUsers();
        });
    }

    function openResetUserConfirm(username, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const user = allUsers.find(item => item.username === username);
      if (!user || user.isAdmin) return;

      resetUsername = username;
      document.getElementById("resetUserError").innerText = "";
      document.getElementById("resetUserCopy").innerText = `This clears ${user.email || username}'s profile details, links, avatar, and theme. Their login account stays active.`;
      const button = document.getElementById("confirmResetUserBtn");
      button.disabled = false;
      button.innerText = "Reset profile";
      document.getElementById("resetUserConfirmModal").style.display = "flex";
    }

    function closeResetUserConfirm() {
      document.getElementById("resetUserConfirmModal").style.display = "none";
      resetUsername = null;
    }

    function confirmResetUser() {
      if (!resetUsername) return;

      const error = document.getElementById("resetUserError");
      const button = document.getElementById("confirmResetUserBtn");
      error.innerText = "";
      button.disabled = true;
      button.innerText = "Resetting...";

      fetch(apiPath(`/admin/users/${resetUsername}/reset-profile`), {
        method: "POST",
        headers: adminHeaders()
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            error.innerText = data.error;
            button.disabled = false;
            button.innerText = "Reset profile";
            return;
          }

          const resetEmail = allUsers.find(item => item.username === resetUsername)?.email || "User";
          showMessage(`${resetEmail} profile reset`);
          closeResetUserConfirm();
          expandedUsername = resetUsername;
          loadUsers();
        })
        .catch(() => {
          error.innerText = "Profile could not be reset. Try again.";
          button.disabled = false;
          button.innerText = "Reset profile";
        });
    }

    function openLogoutConfirm() {
      closeUserMenu();
      document.getElementById("logoutConfirmModal").style.display = "flex";
    }

    function closeLogoutConfirm() {
      document.getElementById("logoutConfirmModal").style.display = "none";
    }

    function logoutAdmin() {
      localStorage.removeItem("email");
      localStorage.removeItem("password");
      window.location.href = appPath("/login");
    }

    adminSearchInput.addEventListener("input", () => renderUsers(allUsers));
    document.addEventListener("click", closeUserMenu);

    if (!isAdmin) {
      localStorage.removeItem("email");
      localStorage.removeItem("password");
      window.location.href = appPath("/login");
    } else {
      loadUsers();
    }
  </script>
</body>

</html>
