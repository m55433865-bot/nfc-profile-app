<!DOCTYPE html>
<html>

<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/nfc/brand.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(0, 200, 150, 0.08), transparent 34%),
        #0f0f0f;
      color: white;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 22px;
    }

    .login-shell {
      max-width: 360px;
      width: 100%;
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin: 0;
    }

    .login-card {
      background: rgba(31, 31, 31, 0.94);
      border: 1px solid #333;
      border-radius: 14px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.38);
      padding: 18px;
    }

    .auth-toggle {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 12px;
      display: grid;
      gap: 4px;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 16px;
      padding: 4px;
    }

    .auth-toggle button {
      background: transparent;
      border: 0;
      border-radius: 9px;
      color: #9f9f9f;
      min-height: 38px;
      padding: 9px 10px;
    }

    .auth-toggle button.active {
      background: rgba(0, 200, 150, 0.14);
      color: #f6fffc;
      box-shadow: inset 0 0 0 1px rgba(0, 200, 150, 0.24);
    }

    .auth-toggle button:hover {
      filter: none;
      transform: none;
    }

    .field {
      margin-bottom: 12px;
      text-align: left;
    }

    .field.hidden {
      display: none;
    }

    label {
      color: #cfcfcf;
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      background: #141414;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
      padding: 12px 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      width: 100%;
    }

    input::placeholder {
      color: #6f6f6f;
    }

    input:focus {
      background: #171717;
      border-color: rgba(0, 200, 150, 0.65);
      box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.12);
    }

    .error {
      color: #ff8b8b;
      font-size: 13px;
      min-height: 18px;
      margin: 2px 0 12px;
      text-align: left;
    }

    button {
      background: #00c896;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #07110e;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 100%;
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    .auth-divider {
      align-items: center;
      color: #777;
      display: flex;
      font-size: 12px;
      gap: 10px;
      margin: 16px 0;
      text-transform: uppercase;
    }

    .auth-divider::before,
    .auth-divider::after {
      background: #2f2f2f;
      content: "";
      flex: 1;
      height: 1px;
    }

    .google-auth {
      display: none;
    }

    .google-auth.active {
      display: block;
    }

    .google-button-shell {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      min-height: 44px;
      overflow: hidden;
      padding: 2px;
    }

    .google-note {
      color: #888;
      font-size: 12px;
      line-height: 1.35;
      margin: 10px 0 0;
      text-align: center;
    }

    .auth-switch-copy {
      color: #aaa;
      font-size: 13px;
      margin: 14px 0 0;
      text-align: center;
    }

    .auth-switch-copy button {
      background: transparent;
      border: 0;
      color: #00c896;
      display: inline;
      font-size: inherit;
      padding: 0;
      width: auto;
    }

    .auth-switch-copy button:hover {
      filter: none;
      text-decoration: underline;
      transform: none;
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="brand">
      <div class="brand-mark brand-mark-login" aria-label="NFC Profile">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="brandNGradientLogin" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#00c896" />
              <stop offset="1" stop-color="#30f4ff" />
            </linearGradient>
          </defs>
          <rect class="brand-mark-chip" x="14" y="14" width="36" height="36" rx="10" />
          <path class="brand-mark-n" stroke="url(#brandNGradientLogin)" d="M19 46V18l26 28V18" />
          <path class="brand-mark-wave" d="M47 24c4 4 4 12 0 16" />
          <path class="brand-mark-wave wave-2" d="M52 18c7 8 7 20 0 28" />
        </svg>
      </div>
      <h1>Profile Login</h1>
      <p class="subtitle">Access your profile</p>
    </section>

    <section class="login-card">
      <form autocomplete="off">
        <input type="text" name="fake-username" autocomplete="username" aria-hidden="true" tabindex="-1"
          style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;">
        <div class="auth-toggle" role="tablist" aria-label="Authentication mode">
          <button id="loginModeBtn" class="active" type="button" onclick="setAuthMode('login')">Login</button>
          <button id="signupModeBtn" type="button" onclick="setAuthMode('signup')">Create account</button>
        </div>

        <div id="emailField" class="field hidden">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" name="signup_email" placeholder="Email address" type="email" autocomplete="email">
        </div>

        <div class="field">
          <label for="signupUsername">Username</label>
          <input id="signupUsername" name="signup_username" type="text" placeholder="Username" autocomplete="username">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="new-password" placeholder="Password" type="password" autocomplete="new-password">
        </div>

        <div id="confirmPasswordField" class="field hidden">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirm-password" placeholder="Confirm password" type="password"
            autocomplete="new-password">
        </div>

        <div id="error" class="error"></div>

        <button id="primaryAuthBtn" type="button" onclick="submitAuth()">Login</button>

        <div id="googleAuth" class="google-auth">
          <div class="auth-divider">or</div>
          <div class="google-button-shell">
            <div id="googleButton"></div>
          </div>
          <p id="googleNote" class="google-note">Use Google to sign up or log in. New users go to profile setup.</p>
        </div>

        <p id="authSwitchCopy" class="auth-switch-copy">
          New here? <button type="button" onclick="setAuthMode('signup')">Create an account</button>
        </p>
      </form>
    </section>
  </main>

  <script>
    const BASE_PATH = "/nfc";
    const appPath = (path = "") => `${BASE_PATH}${path.startsWith("/") ? path : `/${path}`}`;
    const apiPath = (path = "") => `${BASE_PATH}/api${path.startsWith("/") ? path : `/${path}`}`;
    const storedUsername = localStorage.getItem("username");
    const storedPassword = localStorage.getItem("password");
    let googleLoginInitialized = false;
    let authMode = "login";

    document.addEventListener("DOMContentLoaded", () => {
      setAuthMode("login");

      const usernameInput = document.getElementById('signupUsername');
      if (usernameInput) {
        usernameInput.addEventListener('input', () => {
          const error = document.getElementById('error');
          if (authMode === 'signup' && usernameInput.value.includes('@')) {
            usernameInput.value = "";
            error.innerText = "Please choose a username, not an email.";
          }
        });
      }

      setTimeout(() => {
        const usernameInput = document.getElementById('signupUsername');
        const error = document.getElementById('error');
        if (usernameInput && usernameInput.value.includes('@')) {
          usernameInput.value = "";
          error.innerText = "Please choose a username, not an email.";
        }
      }, 200);
    });

    if (storedUsername && storedPassword) {
      routeAfterLogin(storedUsername, storedPassword);
    }

    function needsOnboarding(user) {
      const displayName = (user.displayName || "").trim().toLowerCase();
      const userName = (user.username || "").trim().toLowerCase();
      return displayName === userName && !(user.bio || "").trim() && (!Array.isArray(user.links) || user.links.length === 0);
    }

    function routeAfterLogin(username, password) {
      const cleanUsername = (username || "").trim().toLowerCase();

      if (cleanUsername === "66546788") {
        window.location.replace(appPath("/admin"));
        return;
      }

      fetch(apiPath(`/${cleanUsername}`))
        .then(res => res.json())
        .then(user => {
          const completeKey = `onboardingComplete:${cleanUsername}`;
          if (user && !user.error && needsOnboarding(user) && localStorage.getItem(completeKey) !== "true") {
            window.location.replace(appPath("/onboarding"));
            return;
          }

          window.location.replace(appPath(`/profile/${cleanUsername}`));
        })
        .catch(() => {
          window.location.replace(appPath(`/profile/${cleanUsername}`));
        });
    }

    function login() {
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('error');

      error.innerText = "";

      if (!username || !password) {
        error.innerText = "Enter your username and password.";
        return;
      }

      fetch(apiPath("/login"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            error.innerText = data.error;
            return;
          }

          localStorage.setItem('username', data.username || username);
          localStorage.setItem('password', password);

          routeAfterLogin(data.username || username, password);
        })
        .catch(() => {
          error.innerText = "Login failed. Try again.";
        });
    }

    function setAuthMode(mode) {
      authMode = mode === "signup" ? "signup" : "login";
      const isSignup = authMode === "signup";
      const error = document.getElementById('error');

      error.innerText = "";
      document.getElementById("loginModeBtn").classList.toggle("active", !isSignup);
      document.getElementById("signupModeBtn").classList.toggle("active", isSignup);
      document.getElementById("emailField").classList.toggle("hidden", !isSignup);
      document.getElementById("confirmPasswordField").classList.toggle("hidden", !isSignup);
      document.getElementById("primaryAuthBtn").innerText = isSignup ? "Create account" : "Login";
      document.getElementById("password").setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
      document.getElementById("signupUsername").setAttribute("autocomplete", "username");
      document.getElementById("googleNote").innerText = isSignup
        ? "Use Google to sign up instantly, no extra form needed."
        : "Use Google to sign up or log in. New users go to profile setup.";
      document.getElementById("authSwitchCopy").innerHTML = isSignup
        ? `Already have an account? <button type="button" onclick="setAuthMode('login')">Log in</button>`
        : `New here? <button type="button" onclick="setAuthMode('signup')">Create an account</button>`;
    }

    function submitAuth() {
      if (authMode === "signup") {
        signup();
        return;
      }

      login();
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
    }

    function signup() {
      const email = document.getElementById('signupEmail').value.trim().toLowerCase();
      const username = document.getElementById('signupUsername').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const error = document.getElementById('error');

      error.innerText = "";

      if (!email || !username || !password || !confirmPassword) {
        error.innerText = "Enter your email, username, and password.";
        return;
      }

      if (username.includes('@')) {
        document.getElementById('signupUsername').value = "";
        error.innerText = "Please choose a username, not an email.";
        return;
      }

      if (!isValidEmail(email)) {
        error.innerText = "Enter a valid email address.";
        return;
      }

      if (password !== confirmPassword) {
        error.innerText = "Passwords do not match.";
        return;
      }

      fetch(apiPath("/signup"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, username, password })
      })
        .then(readJsonResponse)
        .then(data => {
          localStorage.setItem('username', data.username || username);
          localStorage.setItem('password', password);
          localStorage.removeItem(`onboardingComplete:${data.username || username}`);
          window.location.replace(appPath("/onboarding"));
        })
        .catch((err) => {
          error.innerText = err.message || "Account could not be created.";
        });
    }

    async function readJsonResponse(response) {
      const text = await response.text();
      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch (error) {
        throw new Error(text || "Unexpected server response");
      }

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      return data;
    }

    function handleGoogleCredential(response) {
      const error = document.getElementById('error');
      error.innerText = "";

      fetch(apiPath("/auth/google"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ credential: response.credential })
      })
        .then(readJsonResponse)
        .then(data => {
          localStorage.setItem("username", data.username);
          localStorage.setItem("password", data.password);
          if (data.created) {
            localStorage.removeItem(`onboardingComplete:${data.username}`);
          }
          routeAfterLogin(data.username, data.password);
        })
        .catch((err) => {
          error.innerText = err.message || "Google login failed. Try again.";
        });
    }

    function initializeGoogleLogin(clientId) {
      if (googleLoginInitialized) return;

      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(() => initializeGoogleLogin(clientId), 120);
        return;
      }

      googleLoginInitialized = true;
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredential,
        ux_mode: "popup"
      });

      document.getElementById("googleAuth").classList.add("active");
      google.accounts.id.renderButton(document.getElementById("googleButton"), {
        theme: "filled_black",
        size: "large",
        shape: "pill",
        text: "continue_with",
        width: 318
      });
    }

    fetch(apiPath("/auth/google/config"))
      .then(readJsonResponse)
      .then((config) => {
        if (config.enabled && config.clientId) {
          initializeGoogleLogin(config.clientId);
        }
      })
      .catch(() => {
        // Normal login remains available if Google auth is not configured.
      });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        submitAuth();
      }
    });
  </script>
</body>

</html>
