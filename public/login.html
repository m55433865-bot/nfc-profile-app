<!DOCTYPE html>
<html>

<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/nfc/favicon.ico" sizes="any">
  <link rel="icon" href="/nfc/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/nfc/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/nfc/apple-touch-icon.png">
  <link rel="manifest" href="/nfc/site.webmanifest">
  <meta name="theme-color" content="#070807">
  <link rel="stylesheet" href="/nfc/brand.css?v=broken-y-3">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(20, 184, 154, 0.07), transparent 34%),
        linear-gradient(180deg, #101110, #070807 58%);
      color: white;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 22px;
    }

    .login-shell {
      max-width: 360px;
      width: 100%;
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #9daaa8;
      font-size: 14px;
      margin: 0;
    }

    .login-card {
      background: rgba(18, 20, 21, 0.94);
      border: 1px solid #2b3033;
      border-radius: 16px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.54), inset 0 1px 0 rgba(255, 255, 255, 0.055);
      padding: 18px;
    }

    .auth-toggle {
      background: #0c0e10;
      border: 1px solid #2b3033;
      border-radius: 12px;
      display: grid;
      gap: 4px;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 16px;
      padding: 4px;
    }

    .auth-toggle button {
      background: transparent;
      border: 0;
      border-radius: 9px;
      color: #9f9f9f;
      min-height: 38px;
      padding: 9px 10px;
    }

    .auth-toggle button.active {
      background: rgba(20, 184, 154, 0.08);
      color: #f6fffc;
      box-shadow: inset 0 0 0 1px rgba(20, 184, 154, 0.2);
    }

    .auth-toggle button:hover {
      filter: none;
      transform: none;
    }

    .field {
      margin-bottom: 12px;
      text-align: left;
    }

    .field.hidden {
      display: none;
    }

    .forgot-password-row {
      margin: -4px 0 12px;
      text-align: right;
    }

    .forgot-password-row.hidden {
      display: none;
    }

    .forgot-password-row button {
      background: transparent;
      border: 0;
      color: #48c7b3;
      display: inline;
      font-size: 13px;
      font-weight: 600;
      padding: 0;
      width: auto;
    }

    .forgot-password-row button:hover {
      filter: none;
      text-decoration: underline;
      transform: none;
    }

    .forgot-panel.hidden,
    .verification-panel.hidden {
      display: none;
    }

    .forgot-panel,
    .verification-panel {
      background: rgba(20, 184, 154, 0.055);
      border: 1px solid rgba(20, 184, 154, 0.16);
      border-radius: 13px;
      margin: 0 0 12px;
      padding: 13px;
    }

    .forgot-copy,
    .verification-copy {
      color: #b9c7c3;
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 12px;
    }

    .success-message {
      color: #8ff7d8;
      font-size: 13px;
      line-height: 1.4;
      margin: 8px 0 0;
      min-height: 18px;
    }

    .verification-actions {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .resend-button,
    .back-button {
      background: transparent;
      border: 1px solid #2b3033;
      color: #d7fff4;
      font-size: 13px;
      padding: 9px 10px;
      width: auto;
    }

    .resend-button:disabled {
      color: #777;
      cursor: not-allowed;
      filter: none;
      opacity: 0.75;
      transform: none;
    }

    label {
      color: #cfcfcf;
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      background: #0c0e10;
      border: 1px solid #2b3033;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
      padding: 12px 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      width: 100%;
    }

    input::placeholder {
      color: #6f6f6f;
    }

    input:focus {
      background: #111416;
      border-color: rgba(20, 184, 154, 0.48);
      box-shadow: 0 0 0 3px rgba(20, 184, 154, 0.09);
    }

    .error {
      color: #ff8b8b;
      font-size: 13px;
      min-height: 18px;
      margin: 2px 0 12px;
      text-align: left;
    }

    button {
      background: linear-gradient(135deg, #f4f1e8, #c9d7d1);
      border: 1px solid transparent;
      border-radius: 10px;
      color: #07110e;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 100%;
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    .auth-divider {
      align-items: center;
      color: #777;
      display: flex;
      font-size: 12px;
      gap: 10px;
      margin: 16px 0;
      text-transform: uppercase;
    }

    .auth-divider::before,
    .auth-divider::after {
      background: #2f2f2f;
      content: "";
      flex: 1;
      height: 1px;
    }

    .google-auth {
      display: none;
    }

    .google-auth.active {
      display: block;
    }

    .google-auth.hidden {
      display: none;
    }

    .google-button-shell {
      background: #151515;
      border: 1px solid #2b3033;
      border-radius: 12px;
      min-height: 44px;
      overflow: hidden;
      padding: 2px;
    }

    .google-note {
      color: #888;
      font-size: 12px;
      line-height: 1.35;
      margin: 10px 0 0;
      text-align: center;
    }

    .auth-switch-copy {
      color: #aaa;
      font-size: 13px;
      margin: 14px 0 0;
      text-align: center;
    }

    .auth-switch-copy button {
      background: transparent;
      border: 0;
      color: #48c7b3;
      display: inline;
      font-size: inherit;
      padding: 0;
      width: auto;
    }

    .auth-switch-copy button:hover {
      filter: none;
      text-decoration: underline;
      transform: none;
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="brand">
      <div class="brand-mark brand-mark-login" aria-label="NFC Profile">
        <img src="/nfc/yourteck-mark.svg?v=exact-1" alt="" aria-hidden="true">
      </div>
      <h1>Profile Login</h1>
      <p class="subtitle">Access your profile</p>
    </section>

    <section class="login-card">
      <form autocomplete="off">
        <div class="auth-toggle" role="tablist" aria-label="Authentication mode">
          <button id="loginModeBtn" class="active" type="button" onclick="setAuthMode('login')">Login</button>
          <button id="signupModeBtn" type="button" onclick="setAuthMode('signup')">Create account</button>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" placeholder="Email address" type="email" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" placeholder="Password" type="password" autocomplete="current-password">
        </div>

        <div id="forgotPasswordRow" class="forgot-password-row">
          <button type="button" onclick="setAuthMode('forgot')">Forgot password?</button>
        </div>

        <div id="confirmPasswordField" class="field hidden">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirm-password" placeholder="Confirm password" type="password"
            autocomplete="new-password">
        </div>

        <div id="forgotPanel" class="forgot-panel hidden">
          <p class="forgot-copy">Enter your account email. If it exists, we will send a secure password reset link.</p>
          <div id="forgotSuccess" class="success-message"></div>
        </div>

        <div id="verificationPanel" class="verification-panel hidden">
          <p id="verificationCopy" class="verification-copy">Enter the 6-digit code sent to your email.</p>
          <div class="field">
            <label for="verificationCode">Verification code</label>
            <input id="verificationCode" name="verification-code" placeholder="6-digit code" type="text"
              inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          </div>
          <div class="verification-actions">
            <button id="backToSignupBtn" class="back-button" type="button" onclick="setAuthMode('signup')">Back</button>
            <button id="resendCodeBtn" class="resend-button" type="button" onclick="resendVerificationCode()">Resend code</button>
          </div>
        </div>

        <div id="error" class="error"></div>

        <button id="primaryAuthBtn" type="button" onclick="submitAuth()">Login</button>

        <div id="googleAuth" class="google-auth">
          <div class="auth-divider">or</div>
          <div class="google-button-shell">
            <div id="googleButton"></div>
          </div>
          <p id="googleNote" class="google-note">Use Google to sign up or log in. New users go to profile setup.</p>
        </div>

        <p id="authSwitchCopy" class="auth-switch-copy">
          New here? <button type="button" onclick="setAuthMode('signup')">Create an account</button>
        </p>
      </form>
    </section>
  </main>

  <script>
    const BASE_PATH = "/nfc";
    const appPath = (path = "") => `${BASE_PATH}${path.startsWith("/") ? path : `/${path}`}`;
    const apiPath = (path = "") => `${BASE_PATH}/api${path.startsWith("/") ? path : `/${path}`}`;
    const storedEmail = localStorage.getItem("email");
    const storedPassword = localStorage.getItem("password");
    let googleLoginInitialized = false;
    let authMode = "login";
    let pendingSignup = null;
    let resendTimer = null;

    document.addEventListener("DOMContentLoaded", () => {
      setAuthMode("login");
    });

    if (storedEmail && storedPassword) {
      routeAfterLogin(storedEmail, storedPassword);
    }

    function needsOnboarding(user) {
      const displayName = (user.displayName || "").trim().toLowerCase();
      const userName = (user.username || "").trim().toLowerCase();
      return displayName === userName && !(user.bio || "").trim() && (!Array.isArray(user.links) || user.links.length === 0);
    }

    function routeAfterLogin(email, password) {
      const cleanEmail = (email || "").trim().toLowerCase();
      const ADMIN_EMAIL = "66546788@yourteck.com";

      if (cleanEmail === ADMIN_EMAIL) {
        window.location.replace(appPath("/admin"));
        return;
      }

      fetch(apiPath("/auth/user"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: cleanEmail, password })
      })
        .then(res => res.json())
        .then(user => {
          if (user && user.username) {
            localStorage.setItem("username", user.username);
            if (user && !user.error && needsOnboarding(user)) {
              window.location.replace(appPath("/onboarding"));
              return;
            }
            window.location.replace(appPath(`/profile/${user.username}`));
          } else {
            window.location.replace(appPath("/onboarding"));
          }
        })
        .catch(() => {
          window.location.replace(appPath("/onboarding"));
        });
    }

    function login() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('error');

      error.innerText = "";

      if (!email || !password) {
        error.innerText = "Enter your email and password.";
        return;
      }

      fetch(apiPath("/login"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            error.innerText = data.error;
            return;
          }

          localStorage.setItem('email', email);
          localStorage.setItem('password', password);

          routeAfterLogin(email, password);
        })
        .catch(() => {
          error.innerText = "Login failed. Try again.";
        });
    }

    function setAuthMode(mode) {
      authMode = mode === "verify" ? "verify" : mode === "forgot" ? "forgot" : mode === "signup" ? "signup" : "login";
      const isSignup = authMode === "signup";
      const isVerify = authMode === "verify";
      const isForgot = authMode === "forgot";
      const error = document.getElementById('error');

      error.innerText = "";
      document.getElementById("forgotSuccess").innerText = "";
      document.getElementById("loginModeBtn").classList.toggle("active", authMode === "login");
      document.getElementById("signupModeBtn").classList.toggle("active", isSignup || isVerify || isForgot);
      document.getElementById("password").parentElement.classList.toggle("hidden", isForgot);
      document.getElementById("forgotPasswordRow").classList.toggle("hidden", authMode !== "login");
      document.getElementById("confirmPasswordField").classList.toggle("hidden", !isSignup);
      document.getElementById("forgotPanel").classList.toggle("hidden", !isForgot);
      document.getElementById("verificationPanel").classList.toggle("hidden", !isVerify);
      document.getElementById("googleAuth").classList.toggle("hidden", isVerify || isForgot);
      document.getElementById("email").disabled = isVerify;
      document.getElementById("password").disabled = isVerify;
      document.getElementById("primaryAuthBtn").innerText = isForgot ? "Send reset link" : isVerify ? "Verify email" : isSignup ? "Create account" : "Login";
      document.getElementById("password").setAttribute("autocomplete", isSignup || isVerify ? "new-password" : "current-password");
      document.getElementById("googleNote").innerText = isSignup
        ? "Use Google to sign up instantly, no extra form needed."
        : "Use Google to sign up or log in. New users go to profile setup.";
      document.getElementById("authSwitchCopy").innerHTML = isSignup
        ? `Already have an account? <button type="button" onclick="setAuthMode('login')">Log in</button>`
        : isVerify
          ? `Need a different email? <button type="button" onclick="setAuthMode('signup')">Edit signup details</button>`
        : isForgot
          ? `Remembered it? <button type="button" onclick="setAuthMode('login')">Back to login</button>`
        : `New here? <button type="button" onclick="setAuthMode('signup')">Create an account</button>`;

      if (!isVerify) {
        document.getElementById("email").disabled = false;
        document.getElementById("password").disabled = false;
      }
    }

    function submitAuth() {
      if (authMode === "forgot") {
        requestPasswordReset();
        return;
      }

      if (authMode === "verify") {
        verifySignupCode();
        return;
      }

      if (authMode === "signup") {
        signup();
        return;
      }

      login();
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
    }

    function requestPasswordReset() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const error = document.getElementById('error');
      const success = document.getElementById("forgotSuccess");

      error.innerText = "";
      success.innerText = "";

      if (!email || !isValidEmail(email)) {
        error.innerText = "Enter a valid email address.";
        return;
      }

      fetch(apiPath("/password-reset/request"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      })
        .then(readJsonResponse)
        .then(data => {
          success.innerText = data.message || "If an account exists, we sent a reset link.";
        })
        .catch((err) => {
          error.innerText = err.message || "Reset link could not be sent.";
        });
    }

    function signup() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const error = document.getElementById('error');

      error.innerText = "";

      if (!email || !password || !confirmPassword) {
        error.innerText = "Enter your email and password.";
        return;
      }

      if (!isValidEmail(email)) {
        error.innerText = "Enter a valid email address.";
        return;
      }

      if (password !== confirmPassword) {
        error.innerText = "Passwords do not match.";
        return;
      }

      fetch(apiPath("/signup"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      })
        .then(readJsonResponse)
        .then(data => {
          pendingSignup = { email, password };
          showVerificationStep(data);
        })
        .catch((err) => {
          error.innerText = err.message || "Account could not be created.";
        });
    }

    function showVerificationStep(data = {}) {
      const email = pendingSignup?.email || document.getElementById('email').value.trim().toLowerCase();
      document.getElementById("verificationCopy").innerText = `We sent a 6-digit code to ${email}. It expires in 10 minutes.`;
      document.getElementById("verificationCode").value = "";
      setAuthMode("verify");
      setResendCooldown(Number(data.cooldownSeconds || 60));
      setTimeout(() => document.getElementById("verificationCode").focus(), 50);
    }

    function setResendCooldown(seconds) {
      const button = document.getElementById("resendCodeBtn");
      let remaining = Math.max(0, Number(seconds || 0));

      if (resendTimer) {
        clearInterval(resendTimer);
      }

      const update = () => {
        if (remaining > 0) {
          button.disabled = true;
          button.innerText = `Resend in ${remaining}s`;
          remaining -= 1;
          return;
        }

        button.disabled = false;
        button.innerText = "Resend code";
        clearInterval(resendTimer);
        resendTimer = null;
      };

      update();
      resendTimer = setInterval(update, 1000);
    }

    function resendVerificationCode() {
      const error = document.getElementById('error');
      const email = pendingSignup?.email;
      const password = pendingSignup?.password;

      error.innerText = "";

      if (!email || !password) {
        setAuthMode("signup");
        error.innerText = "Enter your signup details again.";
        return;
      }

      fetch(apiPath("/signup"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      })
        .then(readJsonResponse)
        .then(showVerificationStep)
        .catch((err) => {
          error.innerText = err.message || "Code could not be resent.";
          if (err.cooldownSeconds) {
            setResendCooldown(err.cooldownSeconds);
          }
        });
    }

    function verifySignupCode() {
      const error = document.getElementById('error');
      const code = document.getElementById("verificationCode").value.trim();
      const email = pendingSignup?.email;
      const password = pendingSignup?.password;

      error.innerText = "";

      if (!email || !password) {
        setAuthMode("signup");
        error.innerText = "Enter your signup details again.";
        return;
      }

      if (!/^\d{6}$/.test(code)) {
        error.innerText = "Enter the 6-digit code.";
        return;
      }

      fetch(apiPath("/signup/verify"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password, code })
      })
        .then(readJsonResponse)
        .then(data => {
          localStorage.setItem('email', email);
          localStorage.setItem('password', password);
          if (data.username) {
            localStorage.setItem('username', data.username);
            localStorage.removeItem(`onboardingComplete:${data.username}`);
          }
          window.location.replace(appPath("/onboarding"));
        })
        .catch((err) => {
          error.innerText = err.message || "Verification failed.";
        });
    }

    async function readJsonResponse(response) {
      const text = await response.text();
      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch (error) {
        throw new Error(text || "Unexpected server response");
      }

      if (!response.ok) {
        const error = new Error(data.error || "Request failed");
        Object.assign(error, data);
        throw error;
      }

      return data;
    }

    function handleGoogleCredential(response) {
      const error = document.getElementById('error');
      error.innerText = "";

      fetch(apiPath("/auth/google"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ credential: response.credential })
      })
        .then(readJsonResponse)
        .then(data => {
          localStorage.setItem("email", data.email);
          localStorage.setItem("password", data.password);
          if (data.username) {
            localStorage.setItem("username", data.username);
          }
          if (data.created && data.username) {
            localStorage.removeItem(`onboardingComplete:${data.username}`);
          }
          routeAfterLogin(data.email, data.password);
        })
        .catch((err) => {
          error.innerText = err.message || "Google login failed. Try again.";
        });
    }

    function initializeGoogleLogin(clientId) {
      if (googleLoginInitialized) return;

      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(() => initializeGoogleLogin(clientId), 120);
        return;
      }

      googleLoginInitialized = true;
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredential,
        ux_mode: "popup"
      });

      document.getElementById("googleAuth").classList.add("active");
      google.accounts.id.renderButton(document.getElementById("googleButton"), {
        theme: "filled_black",
        size: "large",
        shape: "pill",
        text: "continue_with",
        width: 318
      });
    }

    fetch(apiPath("/auth/google/config"))
      .then(readJsonResponse)
      .then((config) => {
        if (config.enabled && config.clientId) {
          initializeGoogleLogin(config.clientId);
        }
      })
      .catch(() => {
        // Normal login remains available if Google auth is not configured.
      });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        submitAuth();
      }
    });
  </script>
</body>

</html>
