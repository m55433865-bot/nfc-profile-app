<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/nfc/favicon.ico" sizes="any">
  <link rel="icon" href="/nfc/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/nfc/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/nfc/apple-touch-icon.png">
  <link rel="manifest" href="/nfc/site.webmanifest">
  <meta name="theme-color" content="#070807">
  <link rel="stylesheet" href="/nfc/brand.css?v=broken-y-3">
  <script src="/nfc/i18n.js?v=arabic-default-1" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at top, rgba(20, 184, 154, 0.07), transparent 34%),
        linear-gradient(180deg, #101110, #070807 58%);
      color: white;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 22px;
    }

    .reset-shell {
      max-width: 360px;
      width: 100%;
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #9daaa8;
      font-size: 14px;
      margin: 0;
    }

    .reset-card {
      background: rgba(18, 20, 21, 0.94);
      border: 1px solid #2b3033;
      border-radius: 16px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.54), inset 0 1px 0 rgba(255, 255, 255, 0.055);
      padding: 18px;
    }

    .field {
      margin-bottom: 12px;
      text-align: left;
    }

    label {
      color: #cfcfcf;
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      background: #0c0e10;
      border: 1px solid #2b3033;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
      padding: 12px 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      width: 100%;
    }

    input::placeholder {
      color: #6f6f6f;
    }

    input:focus {
      background: #111416;
      border-color: rgba(20, 184, 154, 0.48);
      box-shadow: 0 0 0 3px rgba(20, 184, 154, 0.09);
    }

    .message {
      font-size: 13px;
      line-height: 1.4;
      min-height: 18px;
      margin: 2px 0 12px;
      text-align: left;
    }

    .message.error {
      color: #ff8b8b;
    }

    .message.success {
      color: #8ff7d8;
    }

    button,
    .login-link {
      background: linear-gradient(135deg, #f4f1e8, #c9d7d1);
      border: 1px solid transparent;
      border-radius: 10px;
      color: #07110e;
      cursor: pointer;
      display: block;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 14px;
      text-align: center;
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      width: 100%;
    }

    button:hover,
    .login-link:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:active,
    .login-link:active {
      transform: scale(0.98);
    }

    .secondary-link {
      color: #aaa;
      font-size: 13px;
      margin: 14px 0 0;
      text-align: center;
    }

    .secondary-link a {
      color: #48c7b3;
      text-decoration: none;
    }

    .secondary-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="reset-shell">
    <section class="brand">
      <div class="brand-mark brand-mark-login" aria-label="NFC Profile">
        <img src="/nfc/yourteck-mark.svg?v=exact-2" alt="" aria-hidden="true">
      </div>
      <h1>Reset Password</h1>
      <p class="subtitle">Choose a new password</p>
    </section>

    <section class="reset-card">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" placeholder="New password" type="password" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" placeholder="Confirm new password" type="password" autocomplete="new-password">
      </div>

      <div id="message" class="message"></div>

      <button id="resetButton" type="button" onclick="resetPassword()">Reset password</button>

      <p class="secondary-link">
        Need a new link? <a href="/nfc/login">Go back to login</a>
      </p>
    </section>
  </main>

  <script>
    const BASE_PATH = "/nfc";
    const apiPath = (path = "") => `${BASE_PATH}/api${path.startsWith("/") ? path : `/${path}`}`;
    const appPath = (path = "") => `${BASE_PATH}${path.startsWith("/") ? path : `/${path}`}`;
    const token = new URLSearchParams(window.location.search).get("token") || "";

    function setMessage(text, type) {
      const message = document.getElementById("message");
      message.innerText = text || "";
      message.className = `message ${type || ""}`;
    }

    async function readJsonResponse(response) {
      const text = await response.text();
      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch (error) {
        throw new Error(text || "Unexpected server response");
      }

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      return data;
    }

    function showSuccess() {
      const card = document.querySelector(".reset-card");
      card.innerHTML = `
        <div class="message success">Your password was reset. You can log in with your new password now.</div>
        <a class="login-link" href="${appPath("/login")}">Back to login</a>
      `;
    }

    function resetPassword() {
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      setMessage("", "");

      if (!token) {
        setMessage("Reset link is missing. Please request a new one.", "error");
        return;
      }

      if (!password || !confirmPassword) {
        setMessage("Enter and confirm your new password.", "error");
        return;
      }

      if (password !== confirmPassword) {
        setMessage("Passwords do not match.", "error");
        return;
      }

      fetch(apiPath("/password-reset/complete"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token, password })
      })
        .then(readJsonResponse)
        .then(showSuccess)
        .catch((err) => {
          setMessage(err.message || "Password could not be reset.", "error");
        });
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        resetPassword();
      }
    });

    if (!token) {
      setMessage("Reset link is missing. Please request a new one.", "error");
    }
  </script>
</body>

</html>
